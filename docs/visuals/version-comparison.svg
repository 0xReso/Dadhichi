<svg xmlns="http://www.w3.org/2000/svg" width="780" height="236" viewBox="0 0 780 236" role="img" aria-labelledby="title desc">
<title id="title">Two explainer versions, 107 verdicts each</title>
<desc id="desc">In order of pass, borderline, fail, v0.4.0 scored 75, 14, 18. The candidate scored 73, 22, 12.</desc>
<rect width="780" height="236" rx="18" fill="#f8f6ee"/>
<g fill="#17343a" font-family="Helvetica,Arial,sans-serif" font-size="20">
<text x="28" y="43" font-size="28" font-weight="700">Two versions, 107 verdicts each</text>
<rect x="29" y="67" width="16" height="16" fill="#236958"/><text x="55" y="82">Pass</text>
<rect x="138" y="67" width="16" height="16" fill="#efd393"/><text x="164" y="82">Borderline</text>
<rect x="306" y="67" width="16" height="16" fill="#a84637"/><text x="332" y="82">Fail</text>
<text x="28" y="135" font-weight="700">v0.4.0</text>
<rect x="127.0" y="108" width="435.0" height="40" fill="#236958"/><text fill="white" x="344.5" y="135" text-anchor="middle">75</text>
<rect x="562.0" y="108" width="81.2" height="40" fill="#efd393"/><text fill="#372c10" x="602.6" y="135" text-anchor="middle">14</text>
<rect x="643.2" y="108" width="104.4" height="40" fill="#a84637"/><text fill="white" x="695.4" y="135" text-anchor="middle">18</text>
<text x="28" y="196" font-weight="700">v0.4.2</text>
<rect x="127.0" y="169" width="423.4" height="40" fill="#236958"/><text fill="white" x="338.7" y="196" text-anchor="middle">73</text>
<rect x="550.4" y="169" width="127.6" height="40" fill="#efd393"/><text fill="#372c10" x="614.2" y="196" text-anchor="middle">22</text>
<rect x="678.0" y="169" width="69.6" height="40" fill="#a84637"/><text fill="white" x="712.8" y="196" text-anchor="middle">12</text>
</g></svg>
